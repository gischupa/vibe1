/* Folio edition: visual design system, fully self-contained */
:root{--forest:#172722;--deep:#0e1c19;--gold:#c4a473;--cream:#f0e6d2;--paper:#f6f0e4;--ink:#27362f}
body{background:radial-gradient(ellipse at 90% 10%,#32463a 0,transparent 48%),#172722;font-family:Georgia,serif}
button,input,textarea,select,.nav,.eyebrow,.status,.pill,.field label,.btn,.muted,.tile p,.intro p,.entry p,.paper p{font-family:Arial,Helvetica,sans-serif}
h1,h2,h3,.serif,blockquote{font-family:Georgia,'Times New Roman',serif}
h1{font-size:clamp(3.6rem,8vw,7rem);letter-spacing:.085em;line-height:1.07}
h2{font-size:clamp(2.1rem,3.5vw,3.25rem);letter-spacing:-.025em;line-height:1.17}
h3{font-size:clamp(1.35rem,2vw,1.9rem);line-height:1.22}
.topbar{background:#10201cf7;border-bottom:1px solid #c5a46d40;padding:16px 3.5%}
.brand{font-size:1.05rem;letter-spacing:.28em}
.hero{min-height:min(780px,calc(100vh - 68px));place-items:center start;text-align:left;padding:clamp(48px,7vw,105px) clamp(28px,9vw,150px);background:radial-gradient(ellipse at 76% 49%,#34483c 0,transparent 49%),linear-gradient(130deg,#12221e,#1c3029 75%,#12211d)}
.hero:before{background:linear-gradient(90deg,#101f1cf0 0%,#12231fbb 45%,transparent 90%);z-index:1}
.hero-content{max-width:650px;transform:none;position:relative;z-index:2}
.hero h1{margin:28px 0 17px;text-shadow:none;font-weight:400}
.hero .subtitle{font-size:clamp(1rem,1.6vw,1.35rem);letter-spacing:.14em}
.hero blockquote{font-size:clamp(1.55rem,2.3vw,2.1rem);margin:45px 0 24px;line-height:1.35;border-left:2px solid var(--gold);padding-left:22px}
.hero p{margin:0 0 28px;line-height:1.85;max-width:480px}
.hero .ornament{display:none}
.landscape{width:min(65%,780px);height:92%;bottom:2%;left:auto;right:-3%;opacity:.95}
.shell{grid-template-columns:225px minmax(0,1fr)}
.sidebar{background:#11211d;border-right:1px solid #bca47735;padding-top:46px}
.nav{border-radius:0;line-height:1.4;padding:15px 14px}
.main{max-width:1440px;padding:clamp(30px,4vw,60px) clamp(22px,5vw,72px) 90px}
.intro{border-bottom:1px solid #c5a46d52;padding-bottom:23px;margin-bottom:30px}
.intro h2{margin:12px 0 14px}
.intro p{max-width:670px;font-size:.95rem;line-height:1.75}
.grid{gap:17px}
/* Five equal-height illustrated plates; responsive with no orphan at desktop */
.main:has(.act-tile)>.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.tile{border:1px solid #c5a46d5b;border-radius:2px;background:#1c3029;box-shadow:none;padding:24px;text-align:left}
.tile:hover{transform:translateY(-3px);border-color:#d3b783;background:#253b32}
.act-tile{padding:0;display:flex;flex-direction:column;min-height:340px;overflow:hidden;color:var(--cream);width:100%;cursor:pointer}
.act-art{height:175px;background:radial-gradient(circle at center,#34463a 0,#1b2b25 68%);border-bottom:1px solid #c5a46d3f;display:grid;place-items:center;padding:8px}
.folio-art{height:100%;max-width:100%;display:block}
.act-caption{padding:19px 17px 20px;display:flex;flex:1;flex-direction:column}
.act-tile .num{font-size:.8rem;letter-spacing:.15em;color:#d7ba87;font-family:Arial,sans-serif}
.act-tile .num span{font-size:.54rem;letter-spacing:.09em;color:#acb9a8}
.act-tile h3{font-size:1.55rem;font-weight:400;margin:13px 0 8px}
.act-tile p{font-size:.79rem;line-height:1.55;color:#d1d8c9;flex:1}
.act-tile .eyebrow{font-size:.63rem;letter-spacing:.17em;margin-top:14px}
.paper{border-radius:2px;box-shadow:0 8px 35px #0002;background:linear-gradient(145deg,#faf6ed,#f1e9da);padding:clamp(22px,3vw,38px)}
.paper:before{inset:7px;border-color:#a9936740}
.paper h3{font-weight:400}
.field textarea,.field input,.field select{background:#fffcf6;border:1px solid #c9baa1;border-radius:2px}
.btn{border-radius:2px}
.btn.gold{background:#c7a974}
.dark-panel{border:1px solid #c5a46d4f;background:#192b25}
@media(max-width:1170px){.main:has(.act-tile)>.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:780px){.main:has(.act-tile)>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:65px 27px}.landscape{width:95%;opacity:.28}.hero:before{background:linear-gradient(90deg,#10201ce8,transparent)}.act-art{height:145px}}
@media(max-width:470px){.main:has(.act-tile)>.grid{grid-template-columns:1fr}.act-tile{min-height:280px}.act-art{height:150px}.hero h1{font-size:3.4rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Foundation edition: reading workspace and expandable thematic archive */
.act-workspace{margin-top:34px}.section-kicker{font:700 .68rem Arial,sans-serif;letter-spacing:.19em;color:#d3b888;margin-bottom:15px}.section-kicker span{color:#a9b6a8}.chosen-act{border-color:#e4c58d!important;box-shadow:inset 0 0 0 1px #c5a46d}.workspace-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid #c5a46d70;padding:27px 0 20px;margin-top:25px}.workspace-heading h3{margin:7px 0;font-size:1.7rem}.workspace-heading p{max-width:600px;font-size:.9rem;line-height:1.6}.workspace-heading.classroom{margin-top:36px}.reading-prompts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.reading-prompts span{font:400 .76rem Arial,sans-serif;color:#526457;border:1px solid #b9aa8f;border-radius:30px;padding:9px 13px}.chapter-label{font:700 .7rem Arial,sans-serif;letter-spacing:.18em;color:#8c7451;margin:15px 0}.topic-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.topic-tile{min-height:235px;display:flex;flex-direction:column;cursor:pointer}.topic-tile p{flex:1}.topic-kind{font-size:.65rem;letter-spacing:.12em;border:1px solid #c5a46d80;border-radius:2px;padding:5px 8px;margin-left:10px}.topic-tile h3{font-size:1.5rem}.topic-tile .eyebrow{font-size:.66rem}@media(max-width:900px){.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.topic-grid{grid-template-columns:1fr}.workspace-heading{flex-direction:column;align-items:stretch}}
.task-attachments{padding:14px 16px;margin-top:8px;border:1px solid #d3c6ae;background:#f0e8d8}.attachment-label{font-size:.75rem;color:#526457}.attachment-item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #d7cab4}.attachment-item:last-child{border-bottom:0}.attachment-name{font-size:.83rem;overflow-wrap:anywhere}.attachment-actions{display:flex;gap:7px;flex-wrap:wrap}
/* Theme archive — restored legible, compact folio cards */
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:18px}
.topic-tile{display:flex;flex-direction:column;min-height:245px;height:auto;padding:25px 25px 22px;color:#f0e7d5;background:linear-gradient(155deg,#23392f,#192c26);border:1px solid #c5a46d78;text-align:left;cursor:pointer}
.topic-tile .num{display:flex;align-items:center;gap:16px;color:#d8b77f;font:400 2rem Georgia,serif}
.topic-tile .topic-kind{border:1px solid #c5a46d88;padding:5px 9px;color:#d8b77f;font:700 .68rem Arial,sans-serif;letter-spacing:.12em}
.topic-tile h3{color:#f4e9d5!important;font:400 clamp(1.4rem,2vw,1.85rem)/1.2 Georgia,serif;margin:18px 0 10px;overflow-wrap:break-word}
.topic-tile p{color:#c7d0c5!important;font:.86rem/1.55 Arial,sans-serif;margin:0 0 22px}
.topic-tile .eyebrow{color:#d5b780!important;font:700 .68rem Arial,sans-serif;letter-spacing:.16em;margin-top:auto}
.topic-tile:hover,.topic-tile:focus-visible{background:#2b4136;border-color:#e1c68e}
@media(max-width:1050px){.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.topic-grid{grid-template-columns:1fr}.topic-tile{min-height:210px}}

agery and significance.')+`<div class="toolbar"><button class="btn gold" onclick="editQuote()">+ Add a Quotation</button><input id="quoteSearch" aria-label="Search quotations" placeholder="Search quotations…" oninput="filterQuotes()" style="padding:11px;background:#f8f3e8;border:1px solid #c5a46d"></div><div id="quoteResults">${quoteEntries()}</div>`}function quoteEntries(q=''){const arr=state.quotes.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));return arr.length?arr.map(x=>`<div class="paper" style="margin-bottom:18px"><span class="pill">ACT ${escapeHtml(x.act||'?')} · SCENE ${escapeHtml(x.scene||'?')}</span><blockquote style="font-size:2rem;color:#713d43;margin:16px 0">“${escapeHtml(x.text)}”</blockquote><p><strong>${escapeHtml(x.speaker)}</strong> · ${escapeHtml(x.tags)}</p><p>${escapeHtml(x.interpretation)}</p><div class="toolbar"><button class="btn small" onclick="editQuote('${x.id}')">Edit</button><button class="btn small" onclick="toggleFav('${x.id}')">${x.fav?'★ Favourite':'☆ Favourite'}</button><button class="btn small danger" onclick="removeItem('quotes','${x.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No quotations yet. Begin your collection as you read.</div>'}function filterQuotes(){$('#quoteResults').innerHTML=quoteEntries($('#quoteSearch').value)}function editQuote(id){const q=state.quotes.find(x=>x.id===id)||{};formModal(id?'Edit Quotation':'Add a Quotation',[['text','Original quotation','textarea'],['speaker','Speaker'],['act','Act'],['scene','Scene'],['context','Dramatic context','textarea'],['language','Language / dramatic technique','textarea'],['interpretation','Your interpretation','textarea'],['tags','Themes / keywords']],v=>{if(id)Object.assign(q,v);else state.quotes.push({...v,id:uid(),fav:false});save();render()},q)}function toggleFav(id){const q=state.quotes.find(x=>x.id===id);q.fav=!q.fav;save();render()}
function beyondPage(){return intro('05 / BEYOND THE TEXT','Shakespeare on Stage & Today','Explore performance choices, contemporary resonances and your own creative responses.')+`<div class="dark-panel"><h3>Interpretation is a living conversation.</h3><p>How does a performance change our understanding of a scene? What does Macbeth reveal about political ambition and moral responsibility? Use this space for classroom activities and independent reflections.</p></div><div class="toolbar"><button class="btn gold" onclick="addBeyond()">+ Add Reflection</button></div><div class="paper">${state.beyond.length?state.beyond.map(n=>`<div class="entry"><div class="row"><h3>${escapeHtml(n.title)}</h3><div><button class="btn small" onclick="editBeyond('${n.id}')">Edit</button> <button class="btn small danger" onclick="removeItem('beyond','${n.id}')">Delete</button></div></div><p>${escapeHtml(n.body)}</p>${attachmentsFor(n.id)}<button class="btn small" onclick="uploadFor('${n.id}')">+ Attachment</button></div>`).join(''):'<div class="empty">Your reflections and performance analyses will appear here.</div>'}</div>`}function addBeyond(){formModal('New Reflection',[['title','Title'],['body','Your response','textarea']],v=>{const id=uid();state.beyond.push({...v,id});save();render();attachmentPrompt(id)})}function editBeyond(id){const n=state.beyond.find(x=>x.id===id);formModal('Edit Reflection',[['title','Title'],['body','Your response','textarea']],v=>{Object.assign(n,v);save();render();attachmentPrompt(id)},n)}function portfolio(){const completed=TASKS.filter(t=>state.answers[t.id]?.trim()).length;return intro('06 / MY JOURNAL & PORTFOLIO','A Record of Your Reading','Your interpretations grow with the play. Keep your work safe, revisit your ideas and reflect on your progress.')+`<div class="grid"><div class="dark-panel"><span class="eyebrow">READING RESPONSES</span><h3>${completed} / ${TASKS.length}</h3><p>Classroom explorations with responses</p></div><div class="dark-panel"><span async function exportData(){try{await flush();const payload={format:'macbeth-reading-journal',version:VERSION,schema:SCHEMA,exported:new Date().toISOString(),journal:state};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);download(url,'Macbeth_Journal_'+(state.name.trim().replace(/[^a-z0-9_-]/gi,'_')||'Backup')+'.macbeth');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert('Export failed: '+e.message)}}function validateImport(x){if(!x||x.format!=='macbeth-reading-journal'||!x.journal||x.schema!==SCHEMA)throw Error('Unsupported or invalid backup format');const j=x.journal;if(!Array.isArray(j.characters)||!Array.isArray(j.links)||!Array.isArray(j.notes)||!Array.isArray(j.attachments)||!Array.isArray(j.quotes)||!Array.isArray(j.journal)||typeof j.answers!=='object')throw Error('Missing journal data');if(j.attachments.some(a=>typeof a.data!=='string'||!a.data.startsWith('data:')||a.data.length>12e6))throw Error('Invalid attachment');return j}$('#importFile').onchange=async function(){const f=this.files[0];this.value='';if(!f)return;if(f.size>70*1024*1024){alert('This backup is too large.');return}try{const data=validateImport(JSON.parse(await f.text()));if(!confirm('Import this journal? This will replace all work currently saved in this browser. Export a backup first if needed.'))return;state=data;await putDB('journal',state);page='portfolio';selectedNode='macbeth';selectedEdge=null;render();alert('Your journal has been restored successfully.')}catch(e){alert('Import failed. Your existing work was not changed. '+e.message)}};function printPortfolio(){const original=page;const w=window.open('','_blank');if(!w){alert('Please allow pop-ups to print your portfolio.');return}const section=(title,items)=>`<section><h2>${escapeHtml(title)}</h2>${items||'<p>No entries yet.</p>'}</section>`;const lines=TASKS.map(t=>(state.answers[t.id]||state.attachments.some(a=>a.owner==='task:'+t.id))?`<h3>${escapeHtml(t.ti >')}</p>`).join(''))}${section('Themes & Motifs',Object.entries(state.topics).map(([k,v])=>`<h3>${escapeHtml(k)}</h3><p>${escapeHtml(Object.values(v).join('\n')).replace(/\n/g,'<br>')}</p>`).join(''))}${section('Treasury of Quotes',state.quotes.map(q=>`<blockquote>“${escapeHtml(q.text)}”</blockquote><p>${escapeHtml(q.speaker)} · Act ${escapeHtml(q.act)}, Scene ${escapeHtml(q.scene)}<br>${escapeHtml(q.interpretation)}</p>`).join(''))}${section('Beyond the Text',entries(state.beyond))}${section('My Journal',entries(state.journal))}<small>Created with Macbeth – A Digital Reading Journal</small></body></html>`;w.document.open();w.document.write(content);w.document.close();setTimeout(()=>{w.focus();w.print()},450)}
